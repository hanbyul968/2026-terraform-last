apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: wsc-scaling-nodepool
spec:
  template:
    metadata:
      labels:
        dedicated: scaling
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: wsc-scaling-nodeclass
  limits:
    cpu: "100"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: wsc-scaling-nodeclass
spec:
  amiFamily: AL2023
  role: "__NODE_ROLE__"
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "__CLUSTER__"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "__CLUSTER__"
