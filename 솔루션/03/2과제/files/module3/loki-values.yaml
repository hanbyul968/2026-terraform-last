# helm upgrade -i wsc2026-loki grafana/loki -n wsc2026-logging -f loki-values.yaml
#
# 단일 바이너리(SingleBinary) 모드. Service 이름은 wsc2026-loki (클러스터 내부 접근용).
# OTLP 수신을 위해 structured metadata 를 허용해야 한다.

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    allow_structured_metadata: true
    retention_period: 168h
    volume_enabled: true
  rulerConfig:
    storage:
      type: local

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi

# 분산 컴포넌트는 전부 끈다
backend:   { replicas: 0 }
read:      { replicas: 0 }
write:     { replicas: 0 }
ingester:  { replicas: 0 }
querier:   { replicas: 0 }
queryFrontend:   { replicas: 0 }
queryScheduler:  { replicas: 0 }
distributor:     { replicas: 0 }
compactor:       { replicas: 0 }
indexGateway:    { replicas: 0 }
bloomCompactor:  { replicas: 0 }
bloomGateway:    { replicas: 0 }

lokiCanary:
  enabled: false

test:
  enabled: false

gateway:
  enabled: true
  replicas: 1

chunksCache:
  enabled: true
  allocatedMemory: 1024

resultsCache:
  enabled: true
