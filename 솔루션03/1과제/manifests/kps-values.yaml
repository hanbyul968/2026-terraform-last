# kube-prometheus-stack helm values (과제 11 - 모니터링)
#   helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n observability -f kps-values.yaml

prometheus:
  prometheusSpec:
    retention: 7d                       # 데이터 보존 7일
    nodeSelector:
      wsc2026/node: addon
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    nodeSelector:
      wsc2026/node: addon

prometheus-node-exporter:
  tolerations:
    - operator: Exists                  # 모든 노드 DaemonSet

kube-state-metrics:
  nodeSelector:
    wsc2026/node: addon

grafana:
  adminUser: admin
  adminPassword: "Skills$#$@!"
  nodeSelector:
    wsc2026/node: addon
  serviceAccount:
    create: true
    name: grafana-sa                    # Pod Identity 로 wsc2026-grafana-role 연결
  service:
    type: LoadBalancer                  # 외부 접근용 LB
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: observability
    datasources:
      enabled: true
      defaultDatasourceEnabled: false
  additionalDataSources:                # 소문자 이름 3종 (채점 11-2)
    - name: prometheus
      type: prometheus
      access: proxy
      url: http://kube-prometheus-stack-prometheus.observability.svc:9090
      isDefault: true
    - name: alertmanager
      type: alertmanager
      access: proxy
      url: http://kube-prometheus-stack-alertmanager.observability.svc:9093
      jsonData:
        implementation: prometheus
    - name: cloudwatch
      type: cloudwatch
      access: proxy
      jsonData:
        authType: default
        defaultRegion: ap-northeast-2
        logGroups:
          - arn: ""
            name: /wsc2026/app/log

additionalPrometheusRulesMap:           # Alert 5종 (Reference02)
  wsc2026-rules:
    groups:
      - name: wsc2026.rules
        rules:
          - alert: PodHighCPU
            expr: |
              sum(rate(container_cpu_usage_seconds_total{container!="",namespace="wsc2026"}[2m])) by (pod)
                / sum(kube_pod_container_resource_limits{resource="cpu",namespace="wsc2026"}) by (pod) > 0.8
            for: 3m
            labels: { severity: warning }
          - alert: PodHighMemory
            expr: |
              sum(container_memory_working_set_bytes{container!="",namespace="wsc2026"}) by (pod)
                / sum(kube_pod_container_resource_limits{resource="memory",namespace="wsc2026"}) by (pod) > 0.9
            for: 3m
            labels: { severity: warning }
          - alert: PodNotReady
            expr: |
              sum by (pod) (kube_pod_status_phase{namespace="wsc2026",phase=~"Pending|Unknown|Failed"}) > 0
                or sum by (pod) (kube_pod_container_status_waiting_reason{namespace="wsc2026",reason="CrashLoopBackOff"}) > 0
            for: 3m
            labels: { severity: critical }
          - alert: HighErrorRate
            expr: |
              (sum(rate(http_requests_total{namespace="wsc2026",status=~"5.."}[1m]))
                / clamp_min(sum(rate(http_requests_total{namespace="wsc2026"}[1m])), 1)) > 0.05
            for: 1m
            labels: { severity: critical }
          - alert: HighLatency
            expr: |
              avg(rate(http_request_duration_seconds_sum{namespace="wsc2026"}[3m])
                / clamp_min(rate(http_request_duration_seconds_count{namespace="wsc2026"}[3m]), 1)) > 3
            for: 3m
            labels: { severity: warning }
