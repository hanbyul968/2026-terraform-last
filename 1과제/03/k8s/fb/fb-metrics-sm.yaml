apiVersion: v1
kind: Service
metadata:
  name: fluent-bit-metrics
  namespace: observability
  labels:
    app.kubernetes.io/name: aws-for-fluent-bit-metrics
spec:
  selector:
    app.kubernetes.io/name: aws-for-fluent-bit
  ports:
    - name: metrics
      port: 2021
      targetPort: 2021
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fluent-bit-metrics
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aws-for-fluent-bit-metrics
  namespaceSelector:
    matchNames: [observability]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      honorLabels: true
      metricRelabelings:
        # FB는 log_metric_counter_http_requests_total로 노출 -> 알림 expr과 맞게 rename
        - sourceLabels: [__name__]
          regex: 'log_metric_counter_http_requests_total'
          targetLabel: __name__
          replacement: 'http_requests_total'
        # FB는 log_metric_gauge_http_request_duration_seconds로 노출 -> rename
        - sourceLabels: [__name__]
          regex: 'log_metric_gauge_http_request_duration_seconds'
          targetLabel: __name__
          replacement: 'http_request_duration_seconds'
        # 알림/대시보드가 namespace 라벨로 필터하므로 앱 네임스페이스를 부여
        - targetLabel: namespace
          replacement: 'wsc2026'
