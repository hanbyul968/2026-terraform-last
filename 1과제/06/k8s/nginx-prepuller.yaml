# 채점 4-5(NetworkPolicy)용 nginx-test 는 채점 스크립트가
#   kubectl run nginx-test && sleep 3 && kubectl exec ...
# 로 실행하는데, 노드에 nginx 이미지가 없으면 3초 안에 pull+기동을 못 해
# "container not found" 가 난다. 모든 노드에 이미지를 미리 캐싱해 즉시 뜨게 한다.
# (sleep 으로 idle → nginx 서버는 뜨지 않고 이미지만 노드에 상주)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nginx-prepuller
  namespace: skills
spec:
  selector:
    matchLabels:
      app: nginx-prepuller
  template:
    metadata:
      labels:
        app: nginx-prepuller
    spec:
      containers:
        - name: prepuller
          image: PLACEHOLDER_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/ecr-public/nginx/nginx:latest
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      terminationGracePeriodSeconds: 1
