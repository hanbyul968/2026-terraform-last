[SERVICE]
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_PORT    2020
    Parsers_File /fluent-bit/parsers/parsers.conf
    Parsers_File /fluent-bit/etc/parser_extra.conf
[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/*.log
    DB                /var/log/flb_kube.db
    multiline.parser  docker, cri
    Skip_Long_Lines   On
[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_URL            https://kubernetes.default.svc.wsc2026.skills.local:443
    Merge_Log           On
    Merge_Log_Key       data
    Keep_Log            On
[FILTER]
    Name        grep
    Match       kube.*
    Regex       $kubernetes['namespace_name'] ^wsc2026$
[FILTER]
    Name        parser
    Match       kube.*
    Key_Name    log
    Parser      book_access
    Reserve_Data On
    Preserve_Key On
[FILTER]
    Name        grep
    Match       kube.*
    Exclude     path ^/health$
# duration="112.663323ms" -> duration_seconds=0.112663 (log_to_metrics gauge 는 숫자 필드만 허용)
[FILTER]
    Name        lua
    Match       kube.*
    script      /fluent-bit/etc/reformat.lua
    call        add_duration
# 메트릭 갈래 1: 전체 access 로그(/nonexist 4xx 포함)로 http_requests_total 생성 -> HighErrorRate
[FILTER]
    Name              log_to_metrics
    Match             kube.*
    Tag               app_metrics
    metric_mode       counter
    metric_name       http_requests_total
    metric_description Total HTTP requests by status
    label_field       status
    label_field       method
# 메트릭 갈래 2: 응답 시간(초) gauge -> HighLatency
[FILTER]
    Name              log_to_metrics
    Match             kube.*
    Tag               app_metrics
    metric_mode       gauge
    metric_name       http_request_duration_seconds
    metric_description HTTP request duration in seconds
    value_field       duration_seconds
    label_field       status
    label_field       method
# 로그 갈래: /v1/book만 CloudWatch (채점 확정: 실제 API 로그는 /v1/book, 그 외 전부 차단)
[FILTER]
    Name        grep
    Match       kube.*
    Regex       path ^/v1/book$
[FILTER]
    Name        lua
    Match       kube.*
    script      /fluent-bit/etc/reformat.lua
    call        reformat
[OUTPUT]
    Name                  cloudwatch_logs
    Match                 kube.*
    region                ap-northeast-2
    log_group_name        /wsc2026/app/log
    log_stream_prefix     app-
    log_key               log
    auto_retry_requests   true
[OUTPUT]
    Name              prometheus_exporter
    Match             app_metrics
    host              0.0.0.0
    port              2021
