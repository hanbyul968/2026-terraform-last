apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: worldpay-cluster
  region: ap-northeast-2
  version: "1.35"

vpc:
  id: VPC_ID
  subnets:
    private:
      ap-northeast-2a: { id: SUBNET_A }
      ap-northeast-2c: { id: SUBNET_C }
  clusterEndpoints:
    privateAccess: true
    publicAccess: true

accessConfig:
  authenticationMode: API

managedNodeGroups:
  - name: worldpay-nodegroup
    instanceType: t3.large
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    privateNetworking: true
    instanceName: worldpay-node
    tags:
      Name: worldpay-node
    volumeSize: 20

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: eks-pod-identity-agent
