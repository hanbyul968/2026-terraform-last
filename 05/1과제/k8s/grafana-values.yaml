image:
  registry: PLACEHOLDER_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com
  repository: grafana
  tag: "12.3.1"

adminPassword: "Skills53#"

"grafana.ini":
  server:
    root_url: "%(protocol)s://%(domain)s/grafana"
    serve_from_sub_path: true

nodeSelector:
  role: addon

serviceAccount:
  create: false
  name: grafana

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: CloudWatch
        type: cloudwatch
        access: proxy
        uid: cloudwatch
        isDefault: true
        jsonData:
          authType: default
          defaultRegion: ap-northeast-2

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    wsi-dashboard:
      json: |
        {
          "title": "WSI Dashboard",
          "schemaVersion": 38,
          "version": 1,
          "refresh": "30s",
          "panels": [
            {
              "id": 1,
              "title": "Lambda Invocations by Client ID",
              "type": "timeseries",
              "gridPos": {"h": 9, "w": 24, "x": 0, "y": 0},
              "datasource": {"type": "cloudwatch", "uid": "cloudwatch"},
              "options": {
                "tooltip": {"mode": "multi", "sort": "none"},
                "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}
              },
              "fieldConfig": {
                "defaults": {"custom": {"lineWidth": 2}},
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {"type": "cloudwatch", "uid": "cloudwatch"},
                  "queryMode": "Metrics",
                  "metricQueryType": 0,
                  "metricEditorMode": 0,
                  "namespace": "BookReservation",
                  "metricName": "InvocationCount",
                  "statistic": "Sum",
                  "period": "60",
                  "dimensions": {},
                  "matchExact": false,
                  "region": "default"
                }
              ]
            }
          ]
        }
