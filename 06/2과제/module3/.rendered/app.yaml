apiVersion: v1
kind: Namespace
metadata:
  name: skillsmkt
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-processor-sa
  namespace: skillsmkt
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::640107381732:role/skm-order-processor-role"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-processor
  namespace: skillsmkt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-processor
  template:
    metadata:
      labels:
        app: order-processor
    spec:
      serviceAccountName: order-processor-sa
      tolerations:
        - key: "skm-app-nodepool"
          operator: "Exists"
          effect: "NoSchedule"
      nodeSelector:
        karpenter.sh/nodepool: skm-app-nodepool
      containers:
        - name: order-processor
          image: "640107381732.dkr.ecr.ap-northeast-2.amazonaws.com/skm-order-processor:latest"
          ports:
            - containerPort: 8080
          env:
            - name: AWS_REGION
              value: "ap-northeast-2"
            - name: SQS_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/640107381732/skm-order-queue"
            - name: PROCESSING_TIME
              value: "3"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
