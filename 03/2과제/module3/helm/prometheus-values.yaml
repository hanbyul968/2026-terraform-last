# Prometheus (helm: prometheus-community/prometheus, release wsc2026-prometheus)
#  ns: wsc2026-logging
#  - OTel Collector 의 prometheus exporter(:8889) 를 scrape -> log_record_count_total
#  - Grafana 데이터 소스로 사용
#  채점: kubectl exec deploy/wsc2026-prometheus-server -c prometheus-server
server:
  persistentVolume:
    enabled: false
  service:
    type: ClusterIP

# 불필요 컴포넌트 비활성화 (로그 메트릭 수집 목적)
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false
kube-state-metrics:
  enabled: false

# OTel Collector 메트릭 엔드포인트 scrape
extraScrapeConfigs: |
  - job_name: 'otel-collector'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'wsc2026-otel-collector-opentelemetry-collector.wsc2026-logging.svc.cluster.local:8889'
