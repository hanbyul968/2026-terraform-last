# Fluent Bit (helm: fluent/fluent-bit, release wsc2026-fluent-bit, ns wsc2026-logging)
#  - DaemonSet (모든 노드)
#  - Kubernetes 메타데이터(pod/namespace/container) 부착
#  - wsc2026-logging 네임스페이스 로그 제외
#  - Output: OpenTelemetry Collector HTTP(OTLP) 엔드포인트 (port 4318 /v1/logs)
kind: DaemonSet

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 5
        Log_Level info
        Parsers_File parsers.conf
        Parsers_File custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        Mem_Buf_Limit 50MB
        Skip_Long_Lines On

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_Tag_Prefix kube.var.log.containers.
        Merge_Log On
        Merge_Log_Key log_processed
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On
        Annotations Off
        Labels On
    [FILTER]
        Name grep
        Match kube.*
        Exclude $kubernetes['namespace_name'] ^wsc2026-logging$

  outputs: |
    [OUTPUT]
        Name opentelemetry
        Match kube.*
        Host wsc2026-otel-collector-opentelemetry-collector.wsc2026-logging.svc.cluster.local
        Port 4318
        Metrics_uri /v1/metrics
        Logs_uri /v1/logs
        Traces_uri /v1/traces
        Log_response_payload True
        Tls Off
        add_label app fluentbit

tolerations:
  - operator: Exists

resources:
  requests:
    cpu: 50m
    memory: 64Mi
