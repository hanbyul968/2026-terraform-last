apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: wsi-nodepool
spec:
  template:
    metadata:
      labels:
        karpenter.sh/nodepool: wsi-nodepool
    spec:
      taints:
        - key: wsi-nodepool
          effect: NoSchedule
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["c5.large", "c5.xlarge"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: wsi-nodeclass
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 60s
  limits:
    cpu: "8"
    memory: "16Gi"
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: wsi-nodeclass
spec:
  amiSelectorTerms:
    - alias: "al2023@latest"
  role: "${NODE_ROLE_NAME}"
  subnetSelectorTerms:
    - tags:
        kubernetes.io/cluster/wsi-eks: "*"
  securityGroupSelectorTerms:
    - tags:
        kubernetes.io/cluster/wsi-eks: owned
