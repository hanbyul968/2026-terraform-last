apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: skm-app-nodepool
spec:
  template:
    spec:
      taints:
        - key: skm-app-nodepool
          effect: NoSchedule
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.small", "t3.medium"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: skm-app-nodeclass
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 60s
  limits:
    cpu: "8"
    memory: "16Gi"
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: skm-app-nodeclass
spec:
  amiSelectorTerms:
    - alias: "al2023@latest"
  role: "skm-cluster-addon-ng-role"
  subnetSelectorTerms:
    - tags:
        kubernetes.io/cluster/skm-eks-cluster: "*"
  securityGroupSelectorTerms:
    - tags:
        kubernetes.io/cluster/skm-eks-cluster: owned
