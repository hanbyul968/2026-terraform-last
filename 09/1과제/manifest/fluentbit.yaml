apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentbit-sa
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentbit-role
rules:
- apiGroups: [""]
  resources: ["namespaces", "pods", "nodes", "nodes/proxy"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentbit-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluentbit-role
subjects:
- kind: ServiceAccount
  name: fluentbit-sa
  namespace: logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentbit-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/containers/*_worldpay_*.log
        Parser            cri
        Tag               kube.*
        Refresh_Interval  5
        Mem_Buf_Limit     5MB

    [FILTER]
        Name                  kubernetes
        Match                 kube.*
        Kube_URL              https://kubernetes.default.svc:443
        Kube_Tag_Prefix       kube.var.log.containers.
        Merge_Log             On
        Keep_Log              Off
        K8S-Logging.Parser    Off
        Labels                On
        Annotations           Off
        tls.verify            Off
        Use_Kubelet           On
        Kubelet_Host          ${NODE_IP}
        Kubelet_Port          10250

    [FILTER]
        Name    grep
        Match   kube.*
        Exclude log health

    [FILTER]
        Name          record_modifier
        Match         kube.*
        Remove_key    stream
        Remove_key    logtag

    [FILTER]
        Name          lua
        Match         kube.*
        script        /fluent-bit/etc/clean.lua
        call          clean_kubernetes

    [OUTPUT]
        Name              cloudwatch_logs
        Match             kube.*
        region            ap-northeast-2
        log_group_name    /worldpay/application
        log_stream_prefix book-
        auto_create_group false

  clean.lua: |
    function clean_kubernetes(tag, timestamp, record)
      if record["kubernetes"] then
        local k = record["kubernetes"]
        -- labels: app, pod-template-hash 만 유지
        local clean_labels = {}
        if k["labels"] then
          if k["labels"]["app"] then
            clean_labels["app"] = k["labels"]["app"]
          end
          if k["labels"]["pod-template-hash"] then
            clean_labels["pod-template-hash"] = k["labels"]["pod-template-hash"]
          end
        end
        record["kubernetes"] = {
          pod_name       = k["pod_name"],
          namespace_name = k["namespace_name"],
          labels         = clean_labels,
          host           = k["host"],
          pod_ip         = k["pod_ip"]
        }
      end
      return 1, timestamp, record
    end

  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: worldpay-fluentbit
  namespace: logging
spec:
  selector:
    matchLabels:
      name: worldpay-fluentbit
  template:
    metadata:
      labels:
        name: worldpay-fluentbit
    spec:
      serviceAccountName: fluentbit-sa
      containers:
      - name: fluent-bit
        image: ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/aws-for-fluent-bit:latest
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        volumeMounts:
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: config
          mountPath: /fluent-bit/etc/
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: config
        configMap:
          name: fluentbit-config
