# Loki (helm: grafana/loki, release wsc2026-loki, ns wsc2026-logging)
#  - 단일 바이너리(SingleBinary) 모드
#  - OTLP Push 수신 가능 (OTel Collector -> /otlp/v1/logs)
#  - 클러스터 내부 엔드포인트: http://wsc2026-loki.wsc2026-logging.svc.cluster.local:3100
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    allow_structured_metadata: true
    retention_period: 168h
  rulerConfig:
    enable_api: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi

# SingleBinary 모드에서 분산 컴포넌트 비활성화
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false

gateway:
  enabled: false

lokiCanary:
  enabled: false
test:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  serviceMonitor:
    enabled: false
