# helm upgrade -i wsc2026-fluent-bit fluent/fluent-bit -n wsc2026-logging -f fluent-bit-values.yaml
#
# - DaemonSet(모든 노드에서 실행)
# - kubernetes 필터로 Pod/Namespace/Container 메타데이터 부착
# - wsc2026-logging 네임스페이스 로그는 수집 제외 (로그 순환 방지)
# - Output: OTel Collector 의 OTLP/HTTP 엔드포인트(4318)

kind: DaemonSet

tolerations:
  - operator: Exists

config:
  service: |
    [SERVICE]
        Daemon              Off
        Flush               5
        Log_Level           info
        Parsers_File        /fluent-bit/etc/parsers.conf
        Parsers_File        /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server         On
        HTTP_Listen         0.0.0.0
        HTTP_Port           2020
        Health_Check        On

  inputs: |
    [INPUT]
        Name                tail
        Tag                 kube.*
        Path                /var/log/containers/*.log
        Exclude_Path        /var/log/containers/*_wsc2026-logging_*.log,/var/log/containers/*_kube-system_*.log
        multiline.parser    docker, cri
        Mem_Buf_Limit       50MB
        Skip_Long_Lines     On
        Refresh_Interval    10

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           Off
        Keep_Log            On
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Labels              On
        Annotations         Off

    # kubernetes 메타데이터를 OTLP resource/attribute 로 올리기 위해 평탄화
    [FILTER]
        Name                nest
        Match               kube.*
        Operation           lift
        Nested_under        kubernetes
        Add_prefix          k8s_

  outputs: |
    [OUTPUT]
        Name                opentelemetry
        Match               kube.*
        Host                wsc2026-otel-collector-opentelemetry-collector.wsc2026-logging.svc.cluster.local
        Port                4318
        Logs_uri            /v1/logs
        Log_response_payload True
        Tls                 Off
        # 'log' 키의 값을 OTLP LogRecord 의 body 로 매핑
        logs_body_key       $log
        Retry_Limit         5

  customParsers: |
    [PARSER]
        Name                json_log
        Format              json
        Time_Key            timestamp
        Time_Format         %Y-%m-%dT%H:%M:%S.%LZ
