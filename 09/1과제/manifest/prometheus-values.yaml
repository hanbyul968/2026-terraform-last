server:
  replicaCount: 2
  persistentVolume:
    enabled: false
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: server
alertmanager:
  enabled: false
pushgateway:
  enabled: false
