# book 애플리케이션 (과제 8)
# 치환: <ACCOUNT> = 계정ID
# 이미지: <ACCOUNT>.dkr.ecr.ap-northeast-2.amazonaws.com/wsc2026-book-ecr:v1.0.0
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wsc2026-book-sa          # Pod Identity 로 wsc2026-book-pod-role 연결
  namespace: wsc2026
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: book-config              # 채점이 'book-config' 로 조회 (이름 고정)
  namespace: wsc2026
data:
  AWS_REGION: ap-northeast-2
  TABLE_NAME: wsc2026-book-table
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wsc2026-book-deploy
  namespace: wsc2026
  labels: { app: wsc2026-book }
spec:
  replicas: 2                    # 고가용성 (채점 5-1: 2/2)
  selector:
    matchLabels: { app: wsc2026-book }
  template:
    metadata:
      labels: { app: wsc2026-book }
    spec:
      serviceAccountName: wsc2026-book-sa
      nodeSelector:
        wsc2026/node: application # application 노드에만 (채점 5-2/5-4)
      topologySpreadConstraints:  # AZ 균등 분산 (채점 5-2)
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: wsc2026-book }
      containers:
        - name: book
          image: <ACCOUNT>.dkr.ecr.ap-northeast-2.amazonaws.com/wsc2026-book-ecr:v1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: book-config }   # 하드코딩 금지, ConfigMap 참조
          resources:            # .25 vCPU / .5GiB (채점 5-2: cpu 256m mem 512Mi)
            requests: { cpu: "256m", memory: "512Mi" }
            limits:   { cpu: "256m", memory: "512Mi" }
          startupProbe:         # 3종 probe /health:8080 (채점 5-3)
            httpGet: { path: /health, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: wsc2026-book-svc
  namespace: wsc2026
  annotations:
    service.kubernetes.io/topology-mode: "Auto"   # 동일 AZ 우선 라우팅(Cross-AZ 비용 절감)
spec:
  type: ClusterIP
  selector: { app: wsc2026-book }
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wsc2026-book-pdb
  namespace: wsc2026
spec:
  minAvailable: 1               # 드레인/업그레이드 시 최소 1대 유지 (채점 5-1)
  selector:
    matchLabels: { app: wsc2026-book }
