apiVersion: apps/v1
kind: Deployment
metadata:
  name: wsc-scaling-deploy
  namespace: wsc-scaling
  labels:
    dedicated: scaling
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wsc-scaling-deploy
  template:
    metadata:
      labels:
        app: wsc-scaling-deploy
        dedicated: scaling
    spec:
      nodeSelector:
        dedicated: scaling
      containers:
        - name: worker
          image: busybox:latest
          command: ["/bin/sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
