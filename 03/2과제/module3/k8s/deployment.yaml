# log-generator 샘플 애플리케이션 (wsc2026-app 네임스페이스)
#   - ConfigMap 으로 app.py 를 주입하여 python:3.12-slim 컨테이너에서 실행
#   - Service 타입 LoadBalancer 로 엔드포인트 노출 (port 80 -> 8080)
#   - 로그는 JSON 형식으로 stdout 출력 -> Fluent Bit 수집
apiVersion: v1
kind: Namespace
metadata:
  name: wsc2026-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: log-generator-src
  namespace: wsc2026-app
data:
  app.py: |
__APP_PY__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: wsc2026-app
  labels:
    app: log-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-generator
  template:
    metadata:
      labels:
        app: log-generator
    spec:
      containers:
        - name: log-generator
          image: python:3.12-slim
          command: ["python", "/app/app.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: src
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: src
          configMap:
            name: log-generator-src
---
apiVersion: v1
kind: Service
metadata:
  name: log-generator
  namespace: wsc2026-app
  labels:
    app: log-generator
spec:
  type: LoadBalancer
  selector:
    app: log-generator
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
